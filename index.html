                                                        style={{ 
                                                            display: 'flex', 
                                                            alignItems: 'center', 
                                                            gap: '0.75rem', 
                                                            cursor: 'pointer',
                                                            padding: '0.5rem',
                                                            borderRadius: '8px',
                                                            transition: 'background 0.2s ease'
                                                        }}
                                                        onMouseEnter={(e) => e.currentTarget.style.background = 'var(--bg-tertiary)'}
                                                        onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
                                                    >
                                                        <input
                                                            type="checkbox"
                                                            className="checkbox-custom"
                                                            checked={expenseSplitBetween.includes(user.id)}
                                                            onChange={() => toggleSplitPerson(user.id)}
                                                        />
                                                        <div className="avatar avatar-sm" style={{ backgroundColor: user.color }}>
                                                            {user.name[0].toUpperCase()}
                                                        </div>
                                                        <span style={{ fontWeight: '500' }}>{user.name}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        {expenseSplitBetween.length > 0 && expenseAmount && (
                                            <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.5rem' }}>
                                                {formatCurrency(parseFloat(expenseAmount) / expenseSplitBetween.length)} per person
                                            </p>
                                        )}
                                    </div>

                                    <div style={{ display: 'flex', gap: '0.75rem', marginTop: '1rem' }}>
                                        <button 
                                            className="btn btn-primary"
                                            style={{ flex: 1 }}
                                            onClick={saveExpense}
                                        >
                                            {editingExpense ? 'Update' : 'Add'} Expense
                                        </button>
                                        <button 
                                            className="btn btn-secondary"
                                            style={{ flex: 1 }}
                                            onClick={() => setShowExpenseModal(false)}
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Reminder Modal */}
                    {showReminderModal && reminderUser && (
                        <div className="modal-overlay" onClick={() => setShowReminderModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ fontSize: '1.5rem', fontWeight: '700', marginBottom: '1rem' }}>
                                    Send Reminder to {reminderUser.name}
                                </h2>
                                <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginBottom: '1.5rem' }}>
                                    Edit the email template below and click send to open your email client
                                </p>
                                
                                <div style={{ marginBottom: '1.5rem' }}>
                                    <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                        Email Template
                                    </label>
                                    <textarea
                                        className="input-field"
                                        rows="12"
                                        value={emailTemplate}
                                        onChange={(e) => setEmailTemplate(e.target.value)}
                                        style={{ fontFamily: 'monospace', fontSize: '0.8125rem' }}
                                    />
                                </div>

                                <div style={{ display: 'flex', gap: '0.75rem' }}>
                                    <button 
                                        className="btn btn-primary"
                                        style={{ flex: 1 }}
                                        onClick={sendReminder}
                                    >
                                        📧 Send Reminder
                                    </button>
                                    <button 
                                        className="btn btn-secondary"
                                        style={{ flex: 1 }}
                                        onClick={() => setShowReminderModal(false)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TripSplitter />, document.getElementById('root'));
    </script>
</body>
</html>
