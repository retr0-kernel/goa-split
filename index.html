<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Splitter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border-color: #e2e8f0;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --card-bg: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
            --border-color: #334155;
            --accent-primary: #818cf8;
            --accent-secondary: #a78bfa;
            --accent-hover: #6366f1;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --card-bg: #1e293b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        .app-container {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            padding: 2rem 1rem;
            transition: background 0.3s ease;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-xl);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-xl);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .btn-icon {
            padding: 0.625rem;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.875rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--card-bg);
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .user-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .tab-button {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .tab-button.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .tab-button:hover {
            color: var(--accent-primary);
        }

        .stat-card {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 16px;
            border: 2px solid rgba(99, 102, 241, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .balance-positive {
            color: var(--success);
            font-weight: 700;
        }

        .balance-negative {
            color: var(--danger);
            font-weight: 700;
        }

        .balance-zero {
            color: var(--text-tertiary);
            font-weight: 600;
        }

        .settlement-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            border-left: 4px solid var(--success);
            padding: 1.25rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .expense-item {
            background: var(--bg-secondary);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .expense-item:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .export-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .export-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--accent-primary);
        }

        .export-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-primary);
        }

        .theme-toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: var(--accent-primary);
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .theme-toggle-slider.active {
            left: calc(100% - 26px);
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .badge-neutral {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
            font-size: 0.875rem;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 1.5rem 0;
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 1.5rem;
            }
            
            .stat-number {
                font-size: 1.5rem;
            }

            .modal-content {
                padding: 1.5rem;
            }

            .tab-button {
                padding: 0.625rem 1rem;
                font-size: 0.8125rem;
            }
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        select.input-field {
            cursor: pointer;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.75rem;
            white-space: nowrap;
            margin-bottom: 0.5rem;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const COLORS = [
            '#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316',
            '#eab308', '#84cc16', '#22c55e', '#10b981', '#14b8a6',
            '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#a855f7'
        ];

        // Default email template
        const DEFAULT_EMAIL_TEMPLATE = `Subject: Friendly Reminder: Money Settlement

Hi [Name],

Hope you had a great time! This is a friendly reminder about settling up the expenses.

According to our expense tracker, you [owe/are owed] ₹[Amount].

[Settlement Details]

Please let me know once the payment is complete.

Thanks!
[Your Name]`;

        function TripSplitter() {
            const [users, setUsers] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [newUserName, setNewUserName] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [showReminderModal, setShowReminderModal] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [editingExpense, setEditingExpense] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            
            // User form state
            const [userName, setUserName] = useState('');
            const [userPhone, setUserPhone] = useState('');
            const [userEmail, setUserEmail] = useState('');
            const [userUpi, setUserUpi] = useState('');
            
            // Expense form state
            const [expenseDescription, setExpenseDescription] = useState('');
            const [expenseAmount, setExpenseAmount] = useState('');
            const [expensePaidBy, setExpensePaidBy] = useState('');
            const [expenseSplitBetween, setExpenseSplitBetween] = useState([]);

            // Reminder state
            const [reminderUser, setReminderUser] = useState(null);
            const [emailTemplate, setEmailTemplate] = useState(DEFAULT_EMAIL_TEMPLATE);

            // Load data from localStorage
            useEffect(() => {
                const savedUsers = localStorage.getItem('goaTripUsers');
                const savedExpenses = localStorage.getItem('goaTripExpenses');
                const savedTheme = localStorage.getItem('tripSplitterTheme');
                
                if (savedUsers) {
                    const loadedUsers = JSON.parse(savedUsers);
                    // Migrate old users: add contact fields if they don't exist
                    const migratedUsers = loadedUsers.map(user => ({
                        ...user,
                        phone: user.phone || '',
                        email: user.email || '',
                        upi: user.upi || ''
                    }));
                    setUsers(migratedUsers);
                }
                
                if (savedExpenses) setExpenses(JSON.parse(savedExpenses));
                if (savedTheme) setDarkMode(savedTheme === 'dark');
            }, []);

            // Save users to localStorage
            useEffect(() => {
                if (users.length > 0) {
                    localStorage.setItem('goaTripUsers', JSON.stringify(users));
                }
            }, [users]);

            // Save expenses to localStorage
            useEffect(() => {
                if (expenses.length > 0) {
                    localStorage.setItem('goaTripExpenses', JSON.stringify(expenses));
                }
            }, [expenses]);

            // Apply theme
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('tripSplitterTheme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('tripSplitterTheme', 'light');
                }
            }, [darkMode]);

            const openUserModal = (user = null) => {
                if (user) {
                    setEditingUser(user);
                    setUserName(user.name);
                    setUserPhone(user.phone || '');
                    setUserEmail(user.email || '');
                    setUserUpi(user.upi || '');
                } else {
                    setEditingUser(null);
                    setUserName('');
                    setUserPhone('');
                    setUserEmail('');
                    setUserUpi('');
                }
                setShowUserModal(true);
            };

            const saveUser = () => {
                if (!userName.trim()) {
                    alert('Please enter a name');
                    return;
                }

                if (editingUser) {
                    // Update existing user
                    setUsers(users.map(u => 
                        u.id === editingUser.id 
                            ? { ...u, name: userName.trim(), phone: userPhone.trim(), email: userEmail.trim(), upi: userUpi.trim() }
                            : u
                    ));
                } else {
                    // Add new user
                    const newUser = {
                        id: Date.now(),
                        name: userName.trim(),
                        phone: userPhone.trim(),
                        email: userEmail.trim(),
                        upi: userUpi.trim(),
                        color: COLORS[users.length % COLORS.length]
                    };
                    setUsers([...users, newUser]);
                }
                setShowUserModal(false);
            };

            const removeUser = (userId) => {
                if (confirm('Remove this user? Their expenses will remain but you won\'t be able to add new expenses for them.')) {
                    setUsers(users.filter(u => u.id !== userId));
                }
            };

            const openExpenseModal = (expense = null) => {
                if (expense) {
                    setEditingExpense(expense);
                    setExpenseDescription(expense.description);
                    setExpenseAmount(expense.amount.toString());
                    setExpensePaidBy(expense.paidBy);
                    setExpenseSplitBetween(expense.splitBetween);
                } else {
                    setEditingExpense(null);
                    setExpenseDescription('');
                    setExpenseAmount('');
                    setExpensePaidBy('');
                    setExpenseSplitBetween([]);
                }
                setShowExpenseModal(true);
            };

            const saveExpense = () => {
                if (!expenseDescription.trim() || !expenseAmount || !expensePaidBy || expenseSplitBetween.length === 0) {
                    alert('Please fill in all fields');
                    return;
                }

                if (editingExpense) {
                    // Update existing expense
                    setExpenses(expenses.map(e =>
                        e.id === editingExpense.id
                            ? {
                                ...e,
                                description: expenseDescription.trim(),
                                amount: parseFloat(expenseAmount),
                                paidBy: expensePaidBy,
                                splitBetween: expenseSplitBetween
                            }
                            : e
                    ));
                } else {
                    // Add new expense
                    const newExpense = {
                        id: Date.now(),
                        description: expenseDescription.trim(),
                        amount: parseFloat(expenseAmount),
                        paidBy: expensePaidBy,
                        splitBetween: expenseSplitBetween,
                        date: new Date().toISOString()
                    };
                    setExpenses([...expenses, newExpense]);
                }
                setShowExpenseModal(false);
            };

            const deleteExpense = (expenseId) => {
                if (confirm('Delete this expense?')) {
                    setExpenses(expenses.filter(e => e.id !== expenseId));
                }
            };

            const toggleSplitPerson = (userId) => {
                if (expenseSplitBetween.includes(userId)) {
                    setExpenseSplitBetween(expenseSplitBetween.filter(id => id !== userId));
                } else {
                    setExpenseSplitBetween([...expenseSplitBetween, userId]);
                }
            };

            const selectAllForSplit = () => {
                if (expenseSplitBetween.length === users.length) {
                    setExpenseSplitBetween([]);
                } else {
                    setExpenseSplitBetween(users.map(u => u.id));
                }
            };

            const openReminderModal = (user) => {
                const balance = balances[user.id] || 0;
                const balanceText = balance > 0 ? 'are owed' : balance < 0 ? 'owe' : 'are settled';
                const amount = Math.abs(balance);

                let settlementDetails = '';
                if (balance < 0) {
                    const userSettlements = settlements.filter(s => s.from.id === user.id);
                    settlementDetails = userSettlements.map(s => 
                        `- Pay ${formatCurrency(s.amount)} to ${s.to.name}${s.to.upi ? ' (UPI: ' + s.to.upi + ')' : ''}`
                    ).join('\n');
                } else if (balance > 0) {
                    const userSettlements = settlements.filter(s => s.to.id === user.id);
                    settlementDetails = userSettlements.map(s => 
                        `- Receive ${formatCurrency(s.amount)} from ${s.from.name}`
                    ).join('\n');
                }

                const personalizedTemplate = DEFAULT_EMAIL_TEMPLATE
                    .replace('[Name]', user.name)
                    .replace('[owe/are owed]', balanceText)
                    .replace('[Amount]', formatCurrency(amount))
                    .replace('[Settlement Details]', settlementDetails || 'All settled up!');

                setReminderUser(user);
                setEmailTemplate(personalizedTemplate);
                setShowReminderModal(true);
            };

            const sendReminder = () => {
                if (!reminderUser.email) {
                    alert('This user doesn\'t have an email address. Please add one first.');
                    return;
                }

                // Create mailto link
                const subject = emailTemplate.split('\n')[0].replace('Subject: ', '');
                const body = emailTemplate.split('\n').slice(2).join('\n');
                const mailtoLink = `mailto:${reminderUser.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                
                window.location.href = mailtoLink;
                setShowReminderModal(false);
            };

            // Calculate balances
            const calculateBalances = () => {
                const balances = {};
                
                users.forEach(user => {
                    balances[user.id] = 0;
                });

                expenses.forEach(expense => {
                    const sharePerPerson = expense.amount / expense.splitBetween.length;
                    balances[expense.paidBy] += expense.amount;
                    expense.splitBetween.forEach(userId => {
                        balances[userId] -= sharePerPerson;
                    });
                });

                return balances;
            };

            // Calculate settlements
            const calculateSettlements = () => {
                const balances = calculateBalances();
                const settlements = [];

                const owes = [];
                const owed = [];

                Object.entries(balances).forEach(([userId, balance]) => {
                    const user = users.find(u => u.id === parseInt(userId));
                    if (balance < -0.01) {
                        owes.push({ user, amount: Math.abs(balance) });
                    } else if (balance > 0.01) {
                        owed.push({ user, amount: balance });
                    }
                });

                owes.sort((a, b) => b.amount - a.amount);
                owed.sort((a, b) => b.amount - a.amount);

                let i = 0, j = 0;
                while (i < owes.length && j < owed.length) {
                    const transferAmount = Math.min(owes[i].amount, owed[j].amount);
                    
                    settlements.push({
                        from: owes[i].user,
                        to: owed[j].user,
                        amount: transferAmount
                    });

                    owes[i].amount -= transferAmount;
                    owed[j].amount -= transferAmount;

                    if (owes[i].amount < 0.01) i++;
                    if (owed[j].amount < 0.01) j++;
                }

                return settlements;
            };

            const balances = calculateBalances();
            const settlements = calculateSettlements();
            const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);

            // Export functions (keeping same as before)
            const exportToCSV = () => {
                if (expenses.length === 0) {
                    alert('No expenses to export!');
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "EXPENSES\n";
                csvContent += "Date,Description,Amount,Paid By,Split Between,Share Per Person\n";
                expenses.forEach(expense => {
                    const splitNames = expense.splitBetween.map(id => getUserName(id)).join('; ');
                    const sharePerPerson = expense.amount / expense.splitBetween.length;
                    csvContent += `${formatDate(expense.date)},"${expense.description}",${expense.amount},${getUserName(expense.paidBy)},"${splitNames}",${sharePerPerson.toFixed(2)}\n`;
                });
                
                csvContent += "\n\nBALANCES\n";
                csvContent += "Name,Balance,Status\n";
                users.forEach(user => {
                    const balance = balances[user.id] || 0;
                    const status = balance > 0.01 ? 'Gets Back' : balance < -0.01 ? 'Owes' : 'Settled';
                    csvContent += `${user.name},${Math.abs(balance).toFixed(2)},${status}\n`;
                });
                
                csvContent += "\n\nSETTLEMENTS\n";
                csvContent += "From,To,Amount\n";
                settlements.forEach(settlement => {
                    csvContent += `${settlement.from.name},${settlement.to.name},${settlement.amount.toFixed(2)}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "trip_expenses.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const exportToExcel = () => {
                if (expenses.length === 0) {
                    alert('No expenses to export!');
                    return;
                }

                const wb = XLSX.utils.book_new();

                const expensesData = expenses.map(expense => ({
                    'Date': formatDate(expense.date),
                    'Description': expense.description,
                    'Amount': expense.amount,
                    'Paid By': getUserName(expense.paidBy),
                    'Split Between': expense.splitBetween.map(id => getUserName(id)).join(', '),
                    'Share Per Person': (expense.amount / expense.splitBetween.length).toFixed(2)
                }));
                const expensesSheet = XLSX.utils.json_to_sheet(expensesData);
                XLSX.utils.book_append_sheet(wb, expensesSheet, "Expenses");

                const balancesData = users.map(user => {
                    const balance = balances[user.id] || 0;
                    const status = balance > 0.01 ? 'Gets Back' : balance < -0.01 ? 'Owes' : 'Settled';
                    return {
                        'Name': user.name,
                        'Amount': Math.abs(balance).toFixed(2),
                        'Status': status
                    };
                });
                const balancesSheet = XLSX.utils.json_to_sheet(balancesData);
                XLSX.utils.book_append_sheet(wb, balancesSheet, "Balances");

                if (settlements.length > 0) {
                    const settlementsData = settlements.map(settlement => ({
                        'From': settlement.from.name,
                        'To': settlement.to.name,
                        'Amount': settlement.amount.toFixed(2)
                    }));
                    const settlementsSheet = XLSX.utils.json_to_sheet(settlementsData);
                    XLSX.utils.book_append_sheet(wb, settlementsSheet, "Settlements");
                }

                const summaryData = [
                    { 'Metric': 'Total Members', 'Value': users.length },
                    { 'Metric': 'Total Expenses', 'Value': expenses.length },
                    { 'Metric': 'Total Amount Spent', 'Value': totalExpenses.toFixed(2) },
                    { 'Metric': 'Transactions to Settle', 'Value': settlements.length }
                ];
                const summarySheet = XLSX.utils.json_to_sheet(summaryData);
                XLSX.utils.book_append_sheet(wb, summarySheet, "Summary");

                XLSX.writeFile(wb, "trip_expenses.xlsx");
            };

            const exportToPDF = () => {
                if (expenses.length === 0) {
                    alert('No expenses to export!');
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(22);
                doc.setTextColor(99, 102, 241);
                doc.text("🏖️ Trip Expense Report", 105, 20, { align: 'center' });

                doc.setFontSize(12);
                doc.setTextColor(0, 0, 0);
                doc.text(`Total Members: ${users.length}`, 20, 35);
                doc.text(`Total Expenses: ${expenses.length}`, 20, 42);
                doc.text(`Total Spent: ₹${totalExpenses.toFixed(2)}`, 20, 49);
                doc.text(`Generated: ${new Date().toLocaleDateString('en-IN')}`, 20, 56);

                doc.setFontSize(14);
                doc.setTextColor(99, 102, 241);
                doc.text("Expenses", 20, 70);

                const expensesTableData = expenses.map(expense => [
                    formatDate(expense.date),
                    expense.description,
                    `₹${expense.amount.toFixed(2)}`,
                    getUserName(expense.paidBy),
                    expense.splitBetween.map(id => getUserName(id)).join(', ')
                ]);

                doc.autoTable({
                    startY: 75,
                    head: [['Date', 'Description', 'Amount', 'Paid By', 'Split Between']],
                    body: expensesTableData,
                    theme: 'striped',
                    headStyles: { fillColor: [99, 102, 241] },
                    styles: { fontSize: 9 }
                });

                let finalY = doc.lastAutoTable.finalY + 15;
                doc.setFontSize(14);
                doc.setTextColor(99, 102, 241);
                doc.text("Balances", 20, finalY);

                const balancesTableData = users.map(user => {
                    const balance = balances[user.id] || 0;
                    const status = balance > 0.01 ? 'Gets Back' : balance < -0.01 ? 'Owes' : 'Settled';
                    return [
                        user.name,
                        `₹${Math.abs(balance).toFixed(2)}`,
                        status
                    ];
                });

                doc.autoTable({
                    startY: finalY + 5,
                    head: [['Name', 'Amount', 'Status']],
                    body: balancesTableData,
                    theme: 'striped',
                    headStyles: { fillColor: [99, 102, 241] },
                    styles: { fontSize: 10 }
                });

                if (settlements.length > 0) {
                    finalY = doc.lastAutoTable.finalY + 15;
                    
                    if (finalY > 250) {
                        doc.addPage();
                        finalY = 20;
                    }
                    
                    doc.setFontSize(14);
                    doc.setTextColor(99, 102, 241);
                    doc.text("Settlement Plan", 20, finalY);

                    const settlementsTableData = settlements.map(settlement => [
                        settlement.from.name,
                        settlement.to.name,
                        `₹${settlement.amount.toFixed(2)}`
                    ]);

                    doc.autoTable({
                        startY: finalY + 5,
                        head: [['From', 'To', 'Amount']],
                        body: settlementsTableData,
                        theme: 'striped',
                        headStyles: { fillColor: [16, 185, 129] },
                        styles: { fontSize: 10 }
                    });
                }

                doc.save("trip_expenses.pdf");
            };

            const getUserName = (userId) => {
                const user = users.find(u => u.id === userId);
                return user ? user.name : 'Unknown';
            };

            const getUserColor = (userId) => {
                const user = users.find(u => u.id === userId);
                return user ? user.color : '#6366f1';
            };

            const formatCurrency = (amount) => {
                return '₹' + amount.toFixed(2);
            };

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            };

            return (
                <div className="app-container">
                    <div className="main-content">
                        {/* Header */}
                        <div className="header-card">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                <div>
                                    <h1 className="logo-text">🏖️ Trip Splitter</h1>
                                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem' }}>
                                        Smart expense tracking for your adventures
                                    </p>
                                </div>
                                <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center' }}>
                                    {/* Theme Toggle */}
                                    <div 
                                        className="theme-toggle"
                                        onClick={() => setDarkMode(!darkMode)}
                                        data-tooltip={darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                                    >
                                        <div className={`theme-toggle-slider ${darkMode ? 'active' : ''}`}>
                                            {darkMode ? '🌙' : '☀️'}
                                        </div>
                                    </div>
                                    
                                    {/* Clear Data Button */}
                                    <button 
                                        className="btn btn-danger"
                                        onClick={() => {
                                            if (confirm('⚠️ Are you sure you want to clear all data? This will delete all members and expenses permanently. This action cannot be undone.')) {
                                                localStorage.removeItem('goaTripUsers');
                                                localStorage.removeItem('goaTripExpenses');
                                                window.location.reload();
                                            }
                                        }}
                                    >
                                        🗑️ Clear Data
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Tab Navigation */}
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '0.5rem', marginBottom: '2rem', flexWrap: 'wrap' }}>
                            <button 
                                className={`tab-button ${activeTab === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setActiveTab('dashboard')}
                            >
                                📊 Dashboard
                            </button>
                            <button 
                                className={`tab-button ${activeTab === 'expenses' ? 'active' : ''}`}
                                onClick={() => setActiveTab('expenses')}
                            >
                                💰 Expenses
                            </button>
                            <button 
                                className={`tab-button ${activeTab === 'settle' ? 'active' : ''}`}
                                onClick={() => setActiveTab('settle')}
                            >
                                🤝 Settle Up
                            </button>
                            <button 
                                className={`tab-button ${activeTab === 'export' ? 'active' : ''}`}
                                onClick={() => setActiveTab('export')}
                            >
                                📤 Export
                            </button>
                        </div>

                        {/* Dashboard Tab */}
                        {activeTab === 'dashboard' && (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                                {/* Add Users Section */}
                                <div className="card">
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                        <h2 style={{ fontSize: '1.25rem', fontWeight: '700' }}>Trip Members</h2>
                                        <button className="btn btn-primary" onClick={() => openUserModal()}>
                                            ➕ Add Member
                                        </button>
                                    </div>

                                    {users.length === 0 ? (
                                        <p style={{ color: 'var(--text-tertiary)', textAlign: 'center', padding: '3rem 0' }}>
                                            Add members to start tracking expenses
                                        </p>
                                    ) : (
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem' }}>
                                            {users.map(user => (
                                                <div 
                                                    key={user.id} 
                                                    className="user-chip"
                                                    style={{ backgroundColor: user.color, color: 'white' }}
                                                    onClick={() => openUserModal(user)}
                                                >
                                                    <span>{user.name}</span>
                                                    {user.email && <span title="Has email">📧</span>}
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            removeUser(user.id);
                                                        }}
                                                        style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer', fontSize: '1.25rem', lineHeight: '1' }}
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Stats */}
                                {users.length > 0 && (
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>
                                        <div className="card stat-card">
                                            <div className="stat-number">{users.length}</div>
                                            <div className="stat-label">Trip Members</div>
                                        </div>
                                        <div className="card stat-card">
                                            <div className="stat-number">{expenses.length}</div>
                                            <div className="stat-label">Total Expenses</div>
                                        </div>
                                        <div className="card stat-card">
                                            <div className="stat-number">{formatCurrency(totalExpenses)}</div>
                                            <div className="stat-label">Total Spent</div>
                                        </div>
                                    </div>
                                )}

                                {/* Balances */}
                                {users.length > 0 && expenses.length > 0 && (
                                    <div className="card">
                                        <h2 style={{ fontSize: '1.25rem', fontWeight: '700', marginBottom: '1rem' }}>Individual Balances</h2>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                                            {users.map(user => {
                                                const balance = balances[user.id] || 0;
                                                const balanceClass = balance > 0.01 ? 'balance-positive' : balance < -0.01 ? 'balance-negative' : 'balance-zero';
                                                const balanceText = balance > 0.01 ? 'gets back' : balance < -0.01 ? 'owes' : 'settled';
                                                
                                                return (
                                                    <div key={user.id} style={{ 
                                                        display: 'flex', 
                                                        alignItems: 'center', 
                                                        justifyContent: 'space-between', 
                                                        padding: '1rem', 
                                                        background: 'var(--bg-secondary)',
                                                        borderRadius: '12px',
                                                        border: '1px solid var(--border-color)'
                                                    }}>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                            <div className="avatar" style={{ backgroundColor: user.color }}>
                                                                {user.name[0].toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <div style={{ fontWeight: '600' }}>{user.name}</div>
                                                                {user.email && (
                                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)' }}>
                                                                        {user.email}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                            <div className={balanceClass} style={{ textAlign: 'right' }}>
                                                                <div style={{ fontSize: '0.75rem', fontWeight: '500' }}>{balanceText}</div>
                                                                <div style={{ fontSize: '1.25rem' }}>{formatCurrency(Math.abs(balance))}</div>
                                                            </div>
                                                            {user.email && balance !== 0 && (
                                                                <button 
                                                                    className="btn-icon"
                                                                    onClick={() => openReminderModal(user)}
                                                                    title="Send reminder"
                                                                >
                                                                    📧
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* Quick Action */}
                                {users.length > 0 && (
                                    <div style={{ textAlign: 'center' }}>
                                        <button className="btn btn-primary" style={{ padding: '1rem 2rem', fontSize: '1rem' }} onClick={() => openExpenseModal()}>
                                            ➕ Add New Expense
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Expenses Tab */}
                        {activeTab === 'expenses' && (
                            <div>
                                <div className="card">
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                                        <h2 style={{ fontSize: '1.25rem', fontWeight: '700' }}>All Expenses</h2>
                                        {users.length > 0 && (
                                            <button className="btn btn-primary" onClick={() => openExpenseModal()}>
                                                ➕ Add Expense
                                            </button>
                                        )}
                                    </div>

                                    {expenses.length === 0 ? (
                                        <p style={{ color: 'var(--text-tertiary)', textAlign: 'center', padding: '3rem 0' }}>
                                            {users.length === 0 ? 'Add members first to start tracking expenses' : 'No expenses yet. Add your first expense!'}
                                        </p>
                                    ) : (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                            {[...expenses].reverse().map(expense => (
                                                <div key={expense.id} className="expense-item">
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '0.75rem' }}>
                                                        <div style={{ flex: 1 }}>
                                                            <h3 style={{ fontSize: '1.125rem', fontWeight: '700', marginBottom: '0.25rem' }}>
                                                                {expense.description}
                                                            </h3>
                                                            <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)' }}>
                                                                Paid by <span style={{ fontWeight: '600', color: getUserColor(expense.paidBy) }}>
                                                                    {getUserName(expense.paidBy)}
                                                                </span> • {formatDate(expense.date)}
                                                            </p>
                                                        </div>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                            <div style={{ textAlign: 'right' }}>
                                                                <div style={{ fontSize: '1.5rem', fontWeight: '700' }}>
                                                                    {formatCurrency(expense.amount)}
                                                                </div>
                                                                <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)' }}>
                                                                    {formatCurrency(expense.amount / expense.splitBetween.length)} per person
                                                                </div>
                                                            </div>
                                                            <div style={{ display: 'flex', gap: '0.5rem' }}>
                                                                <button className="btn-icon" onClick={() => openExpenseModal(expense)} title="Edit expense">
                                                                    ✏️
                                                                </button>
                                                                <button className="btn-icon" onClick={() => deleteExpense(expense.id)} title="Delete expense">
                                                                    🗑️
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center' }}>
                                                        <span style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)', fontWeight: '600' }}>
                                                            SPLIT BETWEEN:
                                                        </span>
                                                        {expense.splitBetween.map(userId => (
                                                            <span 
                                                                key={userId}
                                                                className="badge"
                                                                style={{ 
                                                                    background: getUserColor(userId) + '20',
                                                                    color: getUserColor(userId),
                                                                    border: `1px solid ${getUserColor(userId)}40`
                                                                }}
                                                            >
                                                                {getUserName(userId)}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Settle Up Tab */}
                        {activeTab === 'settle' && (
                            <div>
                                <div className="card">
                                    <h2 style={{ fontSize: '1.25rem', fontWeight: '700', marginBottom: '1.5rem' }}>Settlement Plan</h2>

                                    {settlements.length === 0 ? (
                                        <div style={{ textAlign: 'center', padding: '3rem 0' }}>
                                            <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>✅</div>
                                            <p style={{ fontSize: '1.25rem', fontWeight: '600', marginBottom: '0.5rem' }}>All Settled Up!</p>
                                            <p style={{ color: 'var(--text-secondary)' }}>Everyone has paid their share</p>
                                        </div>
                                    ) : (
                                        <div>
                                            <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem' }}>
                                                Here's the simplest way to settle all expenses with minimum transactions:
                                            </p>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                                {settlements.map((settlement, index) => (
                                                    <div key={index} className="settlement-card">
                                                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem' }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                                <div className="avatar" style={{ backgroundColor: settlement.from.color }}>
                                                                    {settlement.from.name[0].toUpperCase()}
                                                                </div>
                                                                <div>
                                                                    <div style={{ fontWeight: '700', fontSize: '1rem' }}>{settlement.from.name}</div>
                                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>pays</div>
                                                                </div>
                                                            </div>
                                                            
                                                            <div style={{ textAlign: 'center', padding: '0 1rem' }}>
                                                                <div style={{ fontSize: '1.5rem', fontWeight: '700', color: 'var(--success)' }}>
                                                                    {formatCurrency(settlement.amount)}
                                                                </div>
                                                            </div>

                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                                <div style={{ textAlign: 'right' }}>
                                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>to</div>
                                                                    <div style={{ fontWeight: '700', fontSize: '1rem' }}>{settlement.to.name}</div>
                                                                    {settlement.to.upi && (
                                                                        <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)' }}>
                                                                            UPI: {settlement.to.upi}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                <div className="avatar" style={{ backgroundColor: settlement.to.color }}>
                                                                    {settlement.to.name[0].toUpperCase()}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div style={{ 
                                                marginTop: '1.5rem', 
                                                padding: '1rem', 
                                                background: 'rgba(59, 130, 246, 0.1)',
                                                borderRadius: '12px',
                                                border: '1px solid rgba(59, 130, 246, 0.2)'
                                            }}>
                                                <p style={{ fontSize: '0.875rem', color: 'var(--text-primary)' }}>
                                                    💡 <strong>Tip:</strong> Only {settlements.length} transaction{settlements.length > 1 ? 's' : ''} needed to settle everything!
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Export Tab */}
                        {activeTab === 'export' && (
                            <div>
                                <div className="card">
                                    <h2 style={{ fontSize: '1.25rem', fontWeight: '700', marginBottom: '0.5rem' }}>Export Your Data</h2>
                                    <p style={{ color: 'var(--text-secondary)', marginBottom: '2rem', fontSize: '0.875rem' }}>
                                        Download your trip expenses and settlements in your preferred format
                                    </p>

                                    {expenses.length === 0 ? (
                                        <div style={{ textAlign: 'center', padding: '3rem 0' }}>
                                            <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>📊</div>
                                            <p style={{ fontSize: '1.25rem', fontWeight: '600', marginBottom: '0.5rem' }}>No Data to Export</p>
                                            <p style={{ color: 'var(--text-secondary)' }}>Add some expenses first to export your data</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '1.5rem' }}>
                                                <div className="export-card" onClick={exportToPDF}>
                                                    <div className="export-icon">📄</div>
                                                    <h3 style={{ fontSize: '1.125rem', fontWeight: '700', marginBottom: '0.5rem' }}>Export to PDF</h3>
                                                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginBottom: '1rem' }}>
                                                        Professional report with all details
                                                    </p>
                                                    <div className="btn btn-primary" style={{ display: 'inline-flex' }}>
                                                        Download PDF
                                                    </div>
                                                </div>

                                                <div className="export-card" onClick={exportToCSV}>
                                                    <div className="export-icon">📊</div>
                                                    <h3 style={{ fontSize: '1.125rem', fontWeight: '700', marginBottom: '0.5rem' }}>Export to CSV</h3>
                                                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginBottom: '1rem' }}>
                                                        Simple spreadsheet format
                                                    </p>
                                                    <div className="btn btn-primary" style={{ display: 'inline-flex' }}>
                                                        Download CSV
                                                    </div>
                                                </div>

                                                <div className="export-card" onClick={exportToExcel}>
                                                    <div className="export-icon">📈</div>
                                                    <h3 style={{ fontSize: '1.125rem', fontWeight: '700', marginBottom: '0.5rem' }}>Export to Excel</h3>
                                                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem', marginBottom: '1rem' }}>
                                                        Multi-sheet workbook
                                                    </p>
                                                    <div className="btn btn-primary" style={{ display: 'inline-flex' }}>
                                                        Download Excel
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="divider"></div>

                                            <div style={{ 
                                                padding: '1.5rem', 
                                                background: 'linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1))',
                                                borderRadius: '12px'
                                            }}>
                                                <h4 style={{ fontWeight: '700', marginBottom: '1rem' }}>📋 What's Included:</h4>
                                                <ul style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', listStyle: 'none' }}>
                                                    <li style={{ display: 'flex', gap: '0.75rem' }}>
                                                        <span style={{ color: 'var(--success)', fontWeight: '700' }}>✓</span>
                                                        <span style={{ fontSize: '0.875rem' }}>Complete expense list with dates and amounts</span>
                                                    </li>
                                                    <li style={{ display: 'flex', gap: '0.75rem' }}>
                                                        <span style={{ color: 'var(--success)', fontWeight: '700' }}>✓</span>
                                                        <span style={{ fontSize: '0.875rem' }}>Individual balances breakdown</span>
                                                    </li>
                                                    <li style={{ display: 'flex', gap: '0.75rem' }}>
                                                        <span style={{ color: 'var(--success)', fontWeight: '700' }}>✓</span>
                                                        <span style={{ fontSize: '0.875rem' }}>Optimized settlement plan</span>
                                                    </li>
                                                    <li style={{ display: 'flex', gap: '0.75rem' }}>
                                                        <span style={{ color: 'var(--success)', fontWeight: '700' }}>✓</span>
                                                        <span style={{ fontSize: '0.875rem' }}>Trip summary statistics</span>
                                                    </li>
                                                </ul>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* User Modal */}
                    {showUserModal && (
                        <div className="modal-overlay" onClick={() => setShowUserModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ fontSize: '1.5rem', fontWeight: '700', marginBottom: '1.5rem' }}>
                                    {editingUser ? 'Edit Member' : 'Add New Member'}
                                </h2>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Name *
                                        </label>
                                        <input
                                            type="text"
                                            className="input-field"
                                            placeholder="Enter name"
                                            value={userName}
                                            onChange={(e) => setUserName(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Phone Number
                                        </label>
                                        <input
                                            type="tel"
                                            className="input-field"
                                            placeholder="Optional"
                                            value={userPhone}
                                            onChange={(e) => setUserPhone(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Email Address
                                        </label>
                                        <input
                                            type="email"
                                            className="input-field"
                                            placeholder="For sending reminders"
                                            value={userEmail}
                                            onChange={(e) => setUserEmail(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            UPI ID
                                        </label>
                                        <input
                                            type="text"
                                            className="input-field"
                                            placeholder="For easy payments"
                                            value={userUpi}
                                            onChange={(e) => setUserUpi(e.target.value)}
                                        />
                                    </div>

                                    <div style={{ display: 'flex', gap: '0.75rem', marginTop: '1rem' }}>
                                        <button 
                                            className="btn btn-primary"
                                            style={{ flex: 1 }}
                                            onClick={saveUser}
                                        >
                                            {editingUser ? 'Update' : 'Add'} Member
                                        </button>
                                        <button 
                                            className="btn btn-secondary"
                                            style={{ flex: 1 }}
                                            onClick={() => setShowUserModal(false)}
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Expense Modal */}
                    {showExpenseModal && (
                        <div className="modal-overlay" onClick={() => setShowExpenseModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ fontSize: '1.5rem', fontWeight: '700', marginBottom: '1.5rem' }}>
                                    {editingExpense ? 'Edit Expense' : 'Add New Expense'}
                                </h2>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Description
                                        </label>
                                        <input
                                            type="text"
                                            className="input-field"
                                            placeholder="e.g., Hotel booking, Dinner, etc."
                                            value={expenseDescription}
                                            onChange={(e) => setExpenseDescription(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Amount (₹)
                                        </label>
                                        <input
                                            type="number"
                                            className="input-field"
                                            placeholder="0.00"
                                            value={expenseAmount}
                                            onChange={(e) => setExpenseAmount(e.target.value)}
                                            step="0.01"
                                        />
                                    </div>

                                    <div>
                                        <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Paid by
                                        </label>
                                        <select
                                            className="input-field"
                                            value={expensePaidBy}
                                            onChange={(e) => setExpensePaidBy(parseInt(e.target.value))}
                                        >
                                            <option value="">Select who paid</option>
                                            {users.map(user => (
                                                <option key={user.id} value={user.id}>{user.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                                            <label style={{ fontSize: '0.875rem', fontWeight: '600' }}>
                                                Split between
                                            </label>
                                            <button 
                                                className="btn-secondary"
                                                style={{ padding: '0.5rem 0.75rem', fontSize: '0.75rem' }}
                                                onClick={selectAllForSplit}
                                            >
                                                {expenseSplitBetween.length === users.length ? 'Deselect All' : 'Select All'}
                                            </button>
                                        </div>
                                        <div style={{ 
                                            maxHeight: '200px', 
                                            overflowY: 'auto', 
                                            padding: '0.75rem', 
                                            background: 'var(--bg-secondary)',
                                            borderRadius: '10px',
                                            border: '1px solid var(--border-color)'
                                        }}>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                                {users.map(user => (
                                                    <label 
                                                        key={user.id}
